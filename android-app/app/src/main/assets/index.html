<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TechRec</title>
<style>
/* ── Reset ──────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0f172a;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
a{color:#6366f1;text-decoration:none}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
/* ── App Shell ──────────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100vh;max-width:600px;margin:0 auto}
/* ── Header ─────────────────────────────────────────────────────── */
#header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#1e293b;border-bottom:1px solid #2d3f57;flex-shrink:0;position:relative;z-index:10}
#header-title{font-size:18px;font-weight:700;background:linear-gradient(135deg,#818cf8,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.3px}
.hdr-right{display:flex;gap:8px;align-items:center}
.icon-btn{width:34px;height:34px;background:none;border:1px solid #334155;border-radius:8px;color:#94a3b8;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:all .2s;-webkit-tap-highlight-color:transparent}
.icon-btn:active{background:#334155}
/* ── Views ──────────────────────────────────────────────────────── */
#views{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-bottom:70px}
.view.active{display:block}
/* ── Bottom Nav ─────────────────────────────────────────────────── */
#nav{display:flex;background:#1e293b;border-top:1px solid #2d3f57;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;background:none;border:none;color:#475569;cursor:pointer;font-size:10px;font-weight:500;letter-spacing:0.2px;transition:color .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.nav-btn.active{color:#818cf8}
.nav-icon{font-size:20px;line-height:1}
/* ── Chat View ──────────────────────────────────────────────────── */
#chat-view{padding:0}
#messages{padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;flex-direction:column;max-width:88%;animation:msgIn .2s cubic-bezier(.175,.885,.32,1.1)}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.assistant{align-self:flex-start;align-items:flex-start}
.bubble{padding:11px 15px;border-radius:18px;line-height:1.55;word-break:break-word;font-size:14px}
.user .bubble{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;border-bottom-right-radius:5px}
.assistant .bubble{background:#1e293b;color:#e2e8f0;border-bottom-left-radius:5px;border:1px solid #2d3f57}
.msg-meta{font-size:10px;color:#475569;margin-top:3px;padding:0 4px}
.typing-dots{display:flex;gap:4px;padding:13px 16px;background:#1e293b;border-radius:18px 18px 18px 5px;border:1px solid #2d3f57}
.dot{width:6px;height:6px;background:#6366f1;border-radius:50%;animation:dotBounce .9s infinite ease-in-out}
.dot:nth-child(2){animation-delay:.18s}.dot:nth-child(3){animation-delay:.36s}
/* ── Input Area ─────────────────────────────────────────────────── */
#input-wrap{position:fixed;bottom:60px;left:0;right:0;max-width:600px;margin:0 auto;padding:8px 12px;background:#1e293b;border-top:1px solid #2d3f57;display:flex;gap:8px;align-items:flex-end;z-index:20}
#chat-input{flex:1;background:#0f172a;border:1.5px solid #334155;border-radius:20px;padding:10px 15px;color:#f1f5f9;font-size:14px;resize:none;max-height:100px;min-height:40px;line-height:1.4;outline:none;transition:border-color .2s}
#chat-input:focus{border-color:#6366f1}
#chat-input::placeholder{color:#475569}
#send-btn{width:40px;height:40px;min-width:40px;background:linear-gradient(135deg,#6366f1,#4f46e5);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
#send-btn:active{transform:scale(.92)}
#send-btn:disabled{background:#334155}
#send-btn svg{width:17px;height:17px;fill:#fff}
/* ── Search Progress ─────────────────────────────────────────────── */
#search-bar{margin:0 16px 10px;padding:12px 14px;background:#1e293b;border:1px solid #2d3f57;border-radius:12px;font-size:13px;color:#94a3b8;display:none;align-items:center;gap:10px}
#search-bar.show{display:flex}
.mini-spin{width:14px;height:14px;border:2px solid #334155;border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
/* ── Quick Suggestions ──────────────────────────────────────────── */
#suggestions{padding:8px 16px;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#suggestions::-webkit-scrollbar{display:none}
.sug-chip{flex-shrink:0;padding:7px 13px;background:#1e293b;border:1px solid #334155;border-radius:20px;font-size:12px;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:all .15s;-webkit-tap-highlight-color:transparent}
.sug-chip:active{background:#334155;color:#f1f5f9}
/* ── Picks View ─────────────────────────────────────────────────── */
#picks-view{padding:16px}
.section-head{text-align:center;padding:12px 0 16px;border-bottom:1px solid #2d3f57;margin-bottom:16px}
.section-head h2{font-size:20px;font-weight:700}
.section-head p{font-size:12px;color:#64748b;margin-top:4px;line-height:1.5}
/* ── Product Card ─────────────────────────────────────────────────── */
.p-card{background:#1e293b;border:1px solid #2d3f57;border-radius:16px;margin-bottom:16px;overflow:hidden}
.p-card.is-top{border-color:#6366f1;box-shadow:0 0 20px rgba(99,102,241,.08)}
.p-card-head{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 15px;border-bottom:1px solid #2d3f57}
.p-rank-area{display:flex;align-items:center;gap:10px}
.rank-badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.rb-gold{background:linear-gradient(135deg,#f59e0b,#d97706)}
.rb-silver{background:linear-gradient(135deg,#9ca3af,#6b7280)}
.rb-bronze{background:linear-gradient(135deg,#d97706,#92400e)}
.rb-default{background:#6366f1}
.p-name{font-size:14px;font-weight:700;color:#f1f5f9;line-height:1.3}
.p-brand{font-size:11px;color:#6366f1;margin-top:3px;font-weight:600}
.p-rating-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;margin-left:8px}
.p-stars{font-size:11px;color:#f59e0b;letter-spacing:1px}
.p-score{font-size:11px;color:#64748b}
.p-card-body{padding:14px 15px}
.p-price{font-size:17px;font-weight:700;color:#34d399;margin-bottom:10px}
.p-match{display:inline-block;background:#1e1f50;border:1px solid #4f46e5;border-radius:20px;padding:3px 11px;font-size:11px;color:#818cf8;margin-bottom:10px;font-weight:500}
.pros-cons-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pros h5,.cons h5{font-size:11px;font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.pros h5{color:#34d399}.cons h5{color:#f87171}
.pros ul,.cons ul{list-style:none;padding:0}
.pros li,.cons li{font-size:12px;color:#94a3b8;padding:2px 0 2px 12px;position:relative;line-height:1.4}
.pros li::before{content:'·';position:absolute;left:2px;color:#34d399}
.cons li::before{content:'·';position:absolute;left:2px;color:#f87171}
.p-verdict{font-size:12px;color:#94a3b8;line-height:1.55;padding:9px 11px;background:#0f172a;border-radius:8px;margin-bottom:10px;border:1px solid #1e293b}
.p-best-for{font-size:12px;color:#64748b;margin-bottom:12px}
.p-best-for strong{color:#94a3b8}
.buy-row{display:flex;flex-wrap:wrap;gap:7px}
.buy-chip{display:flex;align-items:center;gap:5px;padding:7px 11px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#cbd5e1;font-size:11px;font-weight:500;text-decoration:none;-webkit-tap-highlight-color:transparent}
.buy-chip:active{border-color:#6366f1;background:#1e293b}
.buy-icon{font-size:13px}
.budget-card{background:#071a15;border:1px solid #10b981;border-radius:16px;padding:14px 15px;margin-bottom:16px}
.budget-label{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:#34d399;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.budget-name{font-size:15px;font-weight:700;color:#f1f5f9;margin-bottom:4px}
.budget-price{font-size:13px;color:#34d399;font-weight:600;margin-bottom:8px}
.budget-why{font-size:12px;color:#94a3b8;line-height:1.5}
.verdict-box{padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.6;margin-bottom:12px}
.verdict-box.success{background:#071a15;border:1px solid #10b981;color:#6ee7b7}
.verdict-box.warn{background:#1a1105;border:1px solid #d97706;color:#fcd34d}
/* ── Admin View ─────────────────────────────────────────────────── */
#admin-view{padding:16px}
.adm-section{background:#1e293b;border:1px solid #2d3f57;border-radius:16px;margin-bottom:16px;overflow:hidden}
.adm-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid #2d3f57}
.adm-head-title{font-size:13px;font-weight:700;color:#f1f5f9;display:flex;align-items:center;gap:7px}
.adm-body{padding:14px}
.f-group{margin-bottom:12px}
.f-group label{display:block;font-size:11px;color:#64748b;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.f-group input,.f-group select{width:100%;background:#0f172a;border:1.5px solid #334155;border-radius:8px;padding:9px 12px;color:#f1f5f9;font-size:14px;outline:none}
.f-group input:focus,.f-group select:focus{border-color:#6366f1}
.f-group select{appearance:none;-webkit-appearance:none}
.f-note{font-size:11px;color:#475569;margin-top:4px;line-height:1.5}
.f-row{display:flex;gap:8px;margin-top:4px}
.btn{padding:9px 15px;border-radius:8px;border:none;font-size:13px;font-weight:600;transition:.15s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-primary{background:#6366f1;color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.btn-ghost{background:none;border:1px solid #334155;color:#94a3b8}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #0f172a}
.list-row:last-child{border-bottom:none}
.list-info{flex:1;min-width:0}
.list-name{font-size:13px;font-weight:600;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-sub{font-size:11px;color:#475569;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-actions{display:flex;gap:6px;flex-shrink:0;margin-left:8px}
/* ── Setup Modal ─────────────────────────────────────────────────── */
#setup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.setup-card{background:#1e293b;border:1px solid #334155;border-radius:20px;width:100%;max-width:380px;overflow:hidden}
.setup-hero{padding:28px 24px 0;text-align:center}
.setup-logo{font-size:52px;margin-bottom:12px}
.setup-hero h1{font-size:24px;font-weight:700;background:linear-gradient(135deg,#818cf8,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.setup-hero p{font-size:13px;color:#64748b;line-height:1.6}
.setup-body{padding:20px 24px}
.setup-footer{padding:0 24px 24px}
/* ── Toast ──────────────────────────────────────────────────────── */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:20px;font-size:13px;font-weight:500;z-index:9999;display:none;white-space:nowrap;pointer-events:none}
#toast.success{background:#10b981;color:#fff;display:block}
#toast.error{background:#ef4444;color:#fff;display:block}
/* ── Animations ──────────────────────────────────────────────────── */
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes dotBounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeIn .3s ease}
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <span id="header-title">🔍 TechRec</span>
    <div class="hdr-right">
      <button class="icon-btn" title="New chat" onclick="newChat()">✦</button>
    </div>
  </div>

  <div id="views">
    <div id="chat-view" class="view active">
      <div id="suggestions"></div>
      <div id="messages"></div>
      <div id="search-bar">
        <div class="mini-spin"></div>
        <span id="search-bar-text">Searching review channels…</span>
      </div>
    </div>

    <div id="picks-view" class="view">
      <div class="section-head">
        <h2>🏆 Top Picks</h2>
        <p id="picks-sub">Chat with TechRec to get personalised recommendations</p>
      </div>
      <div id="product-list"></div>
    </div>

    <div id="admin-view" class="view">
      <div id="admin-body"></div>
    </div>
  </div>

  <div id="input-wrap">
    <textarea id="chat-input" placeholder="e.g. gaming laptop under 50k…" rows="1"></textarea>
    <button id="send-btn" onclick="handleSend()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <nav id="nav">
    <button class="nav-btn active" id="nav-chat" onclick="switchView('chat')">
      <span class="nav-icon">💬</span>Chat
    </button>
    <button class="nav-btn" id="nav-picks" onclick="switchView('picks')">
      <span class="nav-icon">🏆</span>Picks
    </button>
    <button class="nav-btn" id="nav-admin" onclick="switchView('admin')">
      <span class="nav-icon">⚙️</span>Admin
    </button>
  </nav>
</div>

<div id="setup-overlay" style="display:none">
  <div class="setup-card">
    <div class="setup-hero">
      <div class="setup-logo">🔍</div>
      <h1>TechRec</h1>
      <p>AI-powered product advisor. Find the best tech for your needs and budget — just ask in plain English.</p>
    </div>
    <div class="setup-body">
      <div class="f-group">
        <label>Anthropic API Key *</label>
        <input type="password" id="setup-key" placeholder="sk-ant-api03-..." autocomplete="off" autocorrect="off" spellcheck="false">
        <div class="f-note">Get a free key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>. Stored only on this device.</div>
      </div>
    </div>
    <div class="setup-footer">
      <button class="btn btn-primary" style="width:100%;padding:12px" onclick="finishSetup()">Start Exploring →</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════
const Cfg={
  get key()   {return localStorage.getItem('tr_key')||''},
  get ytKey() {return localStorage.getItem('tr_yt')||''},
  get ggKey() {return localStorage.getItem('tr_gg')||''},
  get ggCx()  {return localStorage.getItem('tr_cx')||''},
  get stores()   {try{return JSON.parse(localStorage.getItem('tr_stores'))||DS}catch(_){return DS}},
  get channels() {try{return JSON.parse(localStorage.getItem('tr_channels'))||DC}catch(_){return DC}},
  setKey:   v=>localStorage.setItem('tr_key',v),
  setYtKey: v=>localStorage.setItem('tr_yt',v),
  setGgKey: v=>localStorage.setItem('tr_gg',v),
  setGgCx:  v=>localStorage.setItem('tr_cx',v),
  setStores:   v=>localStorage.setItem('tr_stores',JSON.stringify(v)),
  setChannels: v=>localStorage.setItem('tr_channels',JSON.stringify(v)),
};

// ══════════════════════════════════════════════════
// DEFAULT DATA
// ══════════════════════════════════════════════════
const DS=[
  {id:1,name:'Amazon India',    url:'https://www.amazon.in',         logo:'🛒',searchUrl:'https://www.amazon.in/s?k={q}',              active:true},
  {id:2,name:'Flipkart',        url:'https://www.flipkart.com',      logo:'🏪',searchUrl:'https://www.flipkart.com/search?q={q}',      active:true},
  {id:3,name:'Croma',           url:'https://www.croma.com',         logo:'🔵',searchUrl:'https://www.croma.com/searchB?q={q}',        active:true},
  {id:4,name:'Reliance Digital',url:'https://www.reliancedigital.in',logo:'📱',searchUrl:'https://www.reliancedigital.in/search?q={q}', active:true},
  {id:5,name:'Vijay Sales',     url:'https://www.vijaysales.com',    logo:'🟠',searchUrl:'https://www.vijaysales.com/search/{q}',      active:true},
];
const DC=[
  {id:1, name:'MKBHD',             platform:'youtube',channelId:'UCBJycsmduvYEL83R_U4JriQ',site:null,           active:true},
  {id:2, name:'Dave2D',            platform:'youtube',channelId:'UCVYamHliCI9rw1tHR1xbkfw',site:null,           active:true},
  {id:3, name:'Linus Tech Tips',   platform:'youtube',channelId:'UCXuqSBlHAE6Xw-yeJA0Tunw',site:null,           active:true},
  {id:4, name:'Mr Mobile',         platform:'youtube',channelId:'UCSOpcUkE-is7u7c4AkLgqTw',site:null,           active:true},
  {id:5, name:'JerryRigEverything',platform:'youtube',channelId:'UCWFKCr40YwOZQx8FHU_ZqqQ',site:null,           active:true},
  {id:6, name:'RTINGS.com',        platform:'google', channelId:null, site:'rtings.com',        active:true},
  {id:7, name:"Tom's Hardware",    platform:'google', channelId:null, site:'tomshardware.com',  active:true},
  {id:8, name:'NotebookCheck',     platform:'google', channelId:null, site:'notebookcheck.net', active:true},
  {id:9, name:'GSMArena',          platform:'google', channelId:null, site:'gsmarena.com',      active:true},
  {id:10,name:'The Verge',         platform:'google', channelId:null, site:'theverge.com',      active:true},
];
const SUGS=[
  '🎮 Gaming laptop under 50k',
  '📱 Camera phone under ₹20,000',
  '🎧 Wireless headphones for travel',
  '💻 Light laptop for college',
  '📺 55-inch TV under ₹40,000',
  '⌨️ Mechanical keyboard for coding',
];

// ══════════════════════════════════════════════════
// CLAUDE SYSTEM PROMPT
// ══════════════════════════════════════════════════
const SYS=`You are TechRec, an expert AI product advisor helping users find the best tech products.

## Personality
Friendly, knowledgeable, concise. Ask ONE question at a time. Be direct.

## Flow

Phase 1 — Understand: Parse category, use case, budget ("50k"=50000, "2 lakhs"=200000, "$500"=500 USD).

Phase 2 — Narrow down (max 4 questions, ONE at a time): Ask about performance level, portability/size, must-have features, brand preferences.

Phase 3 — When ready, end your message with EXACTLY this marker and JSON (no space between):
REQUIREMENTS_READY:{"category":"laptop","use_case":"gaming","budget_amount":50000,"budget_currency":"INR","budget_display":"₹50,000","key_requirements":["dedicated GPU","15 inch","good thermals"],"preferences":{"portability":"important"},"search_query":"best gaming laptop under 50000 INR 2024 review"}

Phase 4 — After search results provided, output EXACTLY:
RECOMMENDATIONS_JSON:{"summary":"Brief overview","picks":[{"rank":1,"name":"ASUS TUF Gaming F15 FX506LH","brand":"ASUS","price_range":"₹44,990–₹52,000","rating":8.5,"match_score":94,"pros":["Great GPU for price","Solid build","Good thermals"],"cons":["60Hz display","Average battery"],"best_for":"Budget college gamers","verdict":"Best value in this range"},{"rank":2,"name":"Lenovo IdeaPad Gaming 3","brand":"Lenovo","price_range":"₹42,000–₹48,000","rating":8.1,"match_score":89,"pros":["Reliable brand","Good keyboard","Upgradeable"],"cons":["Runs warm","Plastic build"],"best_for":"First-time gamers","verdict":"Reliable entry-level option"}],"budget_pick":{"name":"Acer Nitro 5 AN515","price_range":"₹38,000–₹43,000","why":"AMD combo punches above its price"},"avoid":"Avoid no-brand 'gaming' laptops with integrated graphics","final_recommendation":"ASUS TUF Gaming F15 offers best performance-to-price ratio with college-friendly build quality."}

Rules: Use REAL model names. 2-4 picks. Always add budget_pick. Ratings out of 10. match_score 0-100.`;

// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
const A={msgs:[],req:null,picks:null,busy:false};

// ══════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════
function boot(){
  if(!Cfg.key){
    document.getElementById('setup-overlay').style.display='flex';
    return;
  }
  renderSugs();
  welcome();
  renderAdmin();
}

function finishSetup(){
  const k=document.getElementById('setup-key').value.trim();
  if(!k.startsWith('sk-')){toast('Enter a valid key (starts with sk-)','error');return;}
  Cfg.setKey(k);
  document.getElementById('setup-overlay').style.display='none';
  renderSugs();
  welcome();
  renderAdmin();
}

// ══════════════════════════════════════════════════
// SUGGESTIONS
// ══════════════════════════════════════════════════
function renderSugs(){
  document.getElementById('suggestions').innerHTML=
    SUGS.map(s=>`<div class="sug-chip" onclick="useSug(${JSON.stringify(s)})">${s}</div>`).join('');
}
function useSug(t){
  const clean=t.replace(/^[\u{1F300}-\u{1FFFF}\u{2600}-\u{26FF}\s]+/u,'').trim();
  document.getElementById('chat-input').value=clean;
  handleSend();
}

function switchView(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('active'));
  document.getElementById(v+'-view').classList.add('active');
  document.getElementById('nav-'+v).classList.add('active');
  document.getElementById('input-wrap').style.display=v==='chat'?'flex':'none';
  if(v==='admin')renderAdmin();
}

// CHAT
// ══════════════════════════════════════════════════
function welcome(){
  bubble('assistant',`👋 Hi! I'm **TechRec** — your AI product advisor.

Tell me what you need in plain language:
• *"Gaming laptop, I have 50k"*
• *"Best phone under ₹20k for camera"*
• *"Noise-cancelling headphones around $200"*

I'll ask a few quick questions, then find your best options! 🎯`);
}

async function handleSend(){
  const inp=document.getElementById('chat-input');
  const txt=inp.value.trim();
  if(!txt||A.busy)return;
  inp.value='';resizeInp(inp);
  document.getElementById('suggestions').innerHTML='';
  bubble('user',txt);
  A.msgs.push({role:'user',content:txt});
  await reply();
}

async function reply(){
  A.busy=true;
  document.getElementById('send-btn').disabled=true;
  const typing=addTyping();
  let buf='',bEl=null;
  try{
    const r=await callClaude(A.msgs);
    typing.remove();
    bEl=bubble('assistant','');
    for await(const c of streamTxt(r)){
      buf+=c;
      setBubble(bEl,buf.split('REQUIREMENTS_READY:')[0].trim());
      scrollBot();
    }
    const clean=buf.split('REQUIREMENTS_READY:')[0].trim();
    A.msgs.push({role:'assistant',content:clean});
    const req=getJSON(buf,'REQUIREMENTS_READY:');
    if(req){A.req=req;await doSearch(req);}
  }catch(e){
    typing?.remove();
    bubble('assistant','⚠️ '+e.message);
  }finally{
    A.busy=false;
    document.getElementById('send-btn').disabled=false;
    scrollBot();
  }
}

// ══════════════════════════════════════════════════
// SEARCH + RECOMMEND
// ══════════════════════════════════════════════════
async function doSearch(req){
  showSearch('Searching trusted review channels…');
  const q=req.search_query||req.category+' '+req.use_case+' review';
  const[yt,gg]=await Promise.all([ytSearch(q),ggSearch(q)]);
  const n=yt.length+gg.length;
  updSearch(n?`Found ${n} reviews — generating recommendations…`:'Generating from knowledge…');
  await genRecs({youtube:yt,google:gg});
}

async function genRecs(sr){
  const ytP=sr.youtube?.length?'\n\n**YouTube Reviews:**\n'+sr.youtube.slice(0,8).map(r=>`- "${r.title}" by ${r.channel} — ${r.url}`).join('\n'):'';
  const ggP=sr.google?.length?'\n\n**Tech Articles:**\n'+sr.google.slice(0,8).map(r=>`- "${r.title}" from ${r.source} — ${r.url}${r.snippet?'\n  '+r.snippet.slice(0,160):''}`).join('\n'):'';
  const storeList=Cfg.stores.filter(s=>s.active).map(s=>`- ${s.name}: ${s.url}`).join('\n');
  const ctx=`Search results gathered. Generate recommendations now.\n${ytP||ggP||'\nNo live data — use training knowledge.'}\n\n**Buy stores:**\n${storeList}\n\nOutput RECOMMENDATIONS_JSON:`;
  const msgs=[...A.msgs,{role:'user',content:ctx}];
  let buf='';
  const bEl=bubble('assistant','');
  try{
    const r=await callClaude(msgs);
    for await(const c of streamTxt(r)){
      buf+=c;
      const d=buf.split('RECOMMENDATIONS_JSON:')[0].trim();
      if(d)setBubble(bEl,d);
      scrollBot();
    }
    const recs=getJSON(buf,'RECOMMENDATIONS_JSON:');
    if(recs){
      A.picks=recs;
      renderPicks(recs);
      hideSearch();
      setTimeout(()=>{
        bubble('assistant','✅ Done! Tap **Picks** below to see your full recommendations with buy links.');
        switchView('picks');
      },400);
    }else{
      hideSearch();
      setBubble(bEl,buf.trim());
    }
  }catch(e){hideSearch();setBubble(bEl,'⚠️ '+e.message);}
}

// ══════════════════════════════════════════════════
// CLAUDE API
// ══════════════════════════════════════════════════
async function callClaude(msgs){
  const key=Cfg.key;
  if(!key)throw new Error('API key not set. Go to Admin → API Keys.');
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body:JSON.stringify({
      model:'claude-opus-4-6',
      max_tokens:8192,
      thinking:{type:'adaptive'},
      system:SYS,
      messages:msgs,
      stream:true,
    }),
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e?.error?.message||`API ${r.status}`);}
  return r;
}

async function* streamTxt(r){
  const reader=r.body.getReader();const dec=new TextDecoder();let p='';
  while(true){
    const{done,value}=await reader.read();if(done)break;
    p+=dec.decode(value,{stream:true});
    const lines=p.split('\n');p=lines.pop();
    for(const l of lines){
      if(!l.startsWith('data:'))continue;
      const raw=l.slice(5).trim();if(raw==='[DONE]')return;
      try{const d=JSON.parse(raw);if(d.type==='content_block_delta'&&d.delta?.type==='text_delta')yield d.delta.text;}catch(_){}
    }
  }
}

// ══════════════════════════════════════════════════
// YOUTUBE / GOOGLE SEARCH
// ══════════════════════════════════════════════════
async function ytSearch(q){
  if(!Cfg.ytKey)return[];
  const chs=Cfg.channels.filter(c=>c.platform==='youtube'&&c.active);
  const res=[];
  for(const ch of chs.slice(0,5)){
    if(!ch.channelId)continue;
    try{
      const p=new URLSearchParams({part:'snippet',channelId:ch.channelId,q,type:'video',order:'relevance',maxResults:'3',key:Cfg.ytKey});
      const d=await(await fetch(`https://www.googleapis.com/youtube/v3/search?${p}`)).json();
      for(const i of d.items||[]){
        const s=i.snippet||{};const v=i.id?.videoId||'';
        res.push({title:s.title||'',channel:s.channelTitle||ch.name,description:(s.description||'').slice(0,200),url:`https://www.youtube.com/watch?v=${v}`});
      }
    }catch(_){continue;}
  }
  return res;
}

async function ggSearch(q){
  if(!Cfg.ggKey||!Cfg.ggCx)return[];
  const chs=Cfg.channels.filter(c=>c.platform==='google'&&c.active);
  const res=[];
  for(const ch of chs.slice(0,5)){
    if(!ch.site)continue;
    try{
      const p=new URLSearchParams({key:Cfg.ggKey,cx:Cfg.ggCx,q:`${q} site:${ch.site}`,num:'3'});
      const d=await(await fetch(`https://www.googleapis.com/customsearch/v1?${p}`)).json();
      for(const i of d.items||[])res.push({title:i.title||'',source:ch.site,snippet:(i.snippet||'').slice(0,200),url:i.link||''});
    }catch(_){continue;}
  }
  return res;
}

// ══════════════════════════════════════════════════
// PICKS RENDERING
// ══════════════════════════════════════════════════
function renderPicks(rec){
  const c=document.getElementById('product-list');
  c.innerHTML='';
  if(rec.summary)document.getElementById('picks-sub').textContent=rec.summary;
  (rec.picks||[]).forEach((p,i)=>c.appendChild(buildCard(p,i)));
  if(rec.budget_pick){
    const bp=rec.budget_pick;
    const e=document.createElement('div');e.className='budget-card fade-in';
    e.innerHTML=`<div class="budget-label">💰 Best Budget Pick</div><div class="budget-name">${x(bp.name)}</div><div class="budget-price">${x(bp.price_range||'')}</div><div class="budget-why">${x(bp.why||'')}</div><div class="buy-row" style="margin-top:10px">${buyRow(bp.name)}</div>`;
    c.appendChild(e);
  }
  if(rec.final_recommendation){const e=document.createElement('div');e.className='verdict-box success fade-in';e.innerHTML=`💡 <strong>Final Verdict:</strong> ${x(rec.final_recommendation)}`;c.appendChild(e);}
  if(rec.avoid){const e=document.createElement('div');e.className='verdict-box warn fade-in';e.innerHTML=`⚠️ <strong>What to avoid:</strong> ${x(rec.avoid)}`;c.appendChild(e);}
}

function buildCard(p,i){
  const el=document.createElement('div');
  el.className='p-card fade-in'+(i===0?' is-top':'');
  const rc=i===0?'rb-gold':i===1?'rb-silver':i===2?'rb-bronze':'rb-default';
  const r=Math.max(0,Math.min(10,p.rating||0));
  const fs=Math.round(r/2);
  const stars='★'.repeat(fs)+'☆'.repeat(5-fs);
  const pros=(p.pros||[]).map(v=>`<li>${x(v)}</li>`).join('');
  const cons=(p.cons||[]).map(v=>`<li>${x(v)}</li>`).join('');
  el.innerHTML=`
    <div class="p-card-head">
      <div class="p-rank-area"><div class="rank-badge ${rc}">${i+1}</div><div><div class="p-name">${x(p.name)}</div><div class="p-brand">${x(p.brand||'')}</div></div></div>
      <div class="p-rating-wrap"><div class="p-stars">${stars}</div><div class="p-score">${r}/10</div></div>
    </div>
    <div class="p-card-body">
      <div class="p-price">${x(p.price_range||'Price varies')}</div>
      ${p.match_score?`<div class="p-match">🎯 ${p.match_score}% match</div>`:''}
      <div class="pros-cons-grid"><div class="pros"><h5>✅ Pros</h5><ul>${pros}</ul></div><div class="cons"><h5>❌ Cons</h5><ul>${cons}</ul></div></div>
      ${p.verdict?`<div class="p-verdict">${x(p.verdict)}</div>`:''}
      ${p.best_for?`<div class="p-best-for">Best for: <strong>${x(p.best_for)}</strong></div>`:''}
      ${buyRow(p.name)}
    </div>`;
  return el;
}

function buyRow(name){
  const stores=Cfg.stores.filter(s=>s.active).slice(0,4);
  if(!stores.length)return'';
  const q=encodeURIComponent(name||'');
  return`<div class="buy-row">${stores.map(s=>{const u=(s.searchUrl||s.url).replace('{q}',q).replace('{query}',q);return`<a href="${u}" target="_blank" class="buy-chip"><span class="buy-icon">${s.logo||'🛒'}</span>${x(s.name)}</a>`;}).join('')}</div>`;
}

// ══════════════════════════════════════════════════
// UI HELPERS
// ══════════════════════════════════════════════════
function bubble(role,txt){
  const e=document.createElement('div');e.className=`msg ${role}`;
  e.innerHTML=`<div class="bubble">${md(txt)}</div><div class="msg-meta">${ts()}</div>`;
  document.getElementById('messages').appendChild(e);scrollBot();return e;
}
function setBubble(e,t){e.querySelector('.bubble').innerHTML=md(t);}
function addTyping(){
  const e=document.createElement('div');e.className='msg assistant';e.id='_t';
  e.innerHTML='<div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  document.getElementById('messages').appendChild(e);scrollBot();return e;
}
function showSearch(t){document.getElementById('search-bar-text').textContent=t;document.getElementById('search-bar').classList.add('show');scrollBot();}
function updSearch(t){document.getElementById('search-bar-text').textContent=t;document.querySelector('#search-bar .mini-spin')?.remove();}
function hideSearch(){document.getElementById('search-bar').classList.remove('show');}
function scrollBot(){const v=document.getElementById('chat-view');v.scrollTop=v.scrollHeight;}
function resizeInp(e){e.style.height='auto';e.style.height=Math.min(e.scrollHeight,100)+'px';}
function ts(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function x(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function md(t){if(!t)return'';return t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code style="background:#0f172a;padding:1px 5px;border-radius:3px;font-size:12px">$1</code>').replace(/^[•\-\*] (.+)$/gm,'<li style="margin-left:14px;margin-bottom:2px">$1</li>').replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>');}
function getJSON(txt,marker){const i=txt.indexOf(marker);if(i===-1)return null;const s=txt.indexOf('{',i+marker.length);if(s===-1)return null;let d=0,e=-1;for(let j=s;j<txt.length;j++){if(txt[j]==='{')d++;else if(txt[j]==='}'){d--;if(d===0){e=j+1;break;}}}if(e===-1)return null;try{return JSON.parse(txt.slice(s,e));}catch(_){return null;}}

let _tt;
function toast(msg,type='success'){const e=document.getElementById('toast');e.textContent=msg;e.className=type;clearTimeout(_tt);_tt=setTimeout(()=>e.className='',2500);}
