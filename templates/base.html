<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f13">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.svg">
  <title>{% block title %}Directory{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f13;
      --surface:  #1a1a22;
      --border:   #2a2a36;
      --accent:   #7c6eff;
      --accent2:  #ff6eb4;
      --text:     #e8e8f0;
      --muted:    #888899;
      --success:  #4ade80;
      --error:    #f87171;
      --radius:   14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }

    html { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; -webkit-text-size-adjust: 100%; }
    body { min-height: 100dvh; display: flex; flex-direction: column; }

    /* ── header ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,15,19,0.92); backdrop-filter: blur(12px);
      padding: calc(var(--safe-top) + 12px) 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .header-title { font-size: 1.1rem; font-weight: 700; flex: 1; }
    .header-back { color: var(--accent); font-size: 1rem; text-decoration: none; padding: 4px 0; }
    .header-action { color: var(--accent); font-size: 0.9rem; text-decoration: none; }

    /* ── layout ── */
    .page { flex: 1; padding: 16px 16px calc(var(--safe-bot) + 80px); max-width: 600px; margin: 0 auto; width: 100%; }

    /* ── bottom nav ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: rgba(15,15,19,0.95); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 8px 0 calc(var(--safe-bot) + 4px);
      display: flex; justify-content: space-around;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: 0.7rem; padding: 4px 16px; -webkit-tap-highlight-color: transparent; }
    .nav-item.active { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; }

    /* ── cards ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
    .card-link { text-decoration: none; color: inherit; display: block; -webkit-tap-highlight-color: transparent; }
    .card-link:active .card { background: #222230; }

    /* ── contact card ── */
    .contact-name { font-size: 1rem; font-weight: 600; margin-bottom: 2px; }
    .contact-meta { font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { background: rgba(124,110,255,0.15); color: var(--accent); border-radius: 20px; padding: 2px 8px; font-size: 0.72rem; white-space: nowrap; }
    .tag-rose { background: rgba(255,110,180,0.15); color: var(--accent2); }

    /* ── forms ── */
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    input[type=text], input[type=date], input[type=password], textarea, input[type=number] {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 1rem;
      font-family: inherit; outline: none; -webkit-appearance: none; appearance: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    .hint { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }

    /* ── buttons ── */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 12px; padding: 14px 20px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; -webkit-tap-highlight-color: transparent; transition: opacity 0.15s; width: 100%; }
    .btn:active { opacity: 0.75; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: rgba(248,113,113,0.15); color: var(--error); border: 1px solid rgba(248,113,113,0.3); }
    .btn-sm { padding: 8px 14px; font-size: 0.85rem; width: auto; border-radius: 8px; }

    /* ── fab ── */
    .fab { position: fixed; bottom: calc(var(--safe-bot) + 70px); right: 16px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; text-decoration: none; box-shadow: 0 4px 20px rgba(124,110,255,0.4); z-index: 99; -webkit-tap-highlight-color: transparent; }

    /* ── flash messages ── */
    .flash { border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: 0.9rem; }
    .flash-success { background: rgba(74,222,128,0.12); color: var(--success); }
    .flash-error   { background: rgba(248,113,113,0.12); color: var(--error); }

    /* ── detail rows ── */
    .detail-row { display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .detail-value { font-size: 0.95rem; }

    /* ── analysis output ── */
    .analysis-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; white-space: pre-wrap; font-size: 0.88rem; line-height: 1.65; overflow-wrap: break-word; }
    .analysis-box h2 { font-size: 0.95rem; color: var(--accent); margin: 14px 0 6px; }
    .analysis-box h3 { font-size: 0.9rem; color: var(--accent2); margin: 12px 0 4px; }
    .analysis-box strong { color: var(--accent); }
    .analysis-box ul { padding-left: 18px; margin: 4px 0; }

    /* ── search bar ── */
    .search-bar { position: relative; margin-bottom: 16px; }
    .search-bar input { padding-left: 40px; background: var(--surface); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

    /* ── empty state ── */
    .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
    .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty p { font-size: 0.95rem; line-height: 1.5; }

    /* ── spinner ── */
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── tags row ── */
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

    /* ── section heading ── */
    .section-heading { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 20px 0 8px; }

    /* ── divider ── */
    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    /* ── checkbox ── */
    .checkbox-row { display: flex; align-items: center; gap: 10px; }
    input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
    .checkbox-row label { margin: 0; font-size: 0.9rem; color: var(--text); cursor: pointer; }
  </style>
  {% block head %}{% endblock %}
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js');
    }
  </script>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
