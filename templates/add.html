{% extends "base.html" %}
{% block title %}Add Contact{% endblock %}
{% block body %}

<div class="header">
  <a href="/" class="header-back">← Back</a>
  <span class="header-title">New Contact</span>
</div>

<div class="page">
  <form method="POST" action="/add" id="addForm">

    <div class="form-group">
      <label for="name">Name *</label>
      <input type="text" id="name" name="name" placeholder="Full name" required autocomplete="name" autofocus>
    </div>

    <div class="form-group">
      <label for="date_met">Date met</label>
      <input type="date" id="date_met" name="date_met" value="{{ today }}">
    </div>

    <div class="form-group">
      <label for="where_met">Where / how did you meet?</label>
      <input type="text" id="where_met" name="where_met" placeholder="e.g. coffee shop, conference, gym">
    </div>

    <div class="divider"></div>

    <div class="form-group">
      <label for="profession">Profession / title</label>
      <input type="text" id="profession" name="profession" placeholder="e.g. VC partner, designer, founder">
    </div>

    <div class="form-group">
      <label for="industry">Industry / domain</label>
      <input type="text" id="industry" name="industry" placeholder="e.g. fintech, climate, e-commerce">
    </div>

    <div class="form-group">
      <label for="skills">Skills &amp; expertise</label>
      <input type="text" id="skills" name="skills" placeholder="Python, fundraising, marketing" autocomplete="off">
      <p class="hint">Comma-separated</p>
    </div>

    <div class="form-group">
      <label for="interests">Interests &amp; passions</label>
      <input type="text" id="interests" name="interests" placeholder="climate tech, travel, music" autocomplete="off">
      <p class="hint">Comma-separated</p>
    </div>

    <div class="divider"></div>

    <div class="form-group">
      <label for="resources">Resources &amp; assets</label>
      <input type="text" id="resources" name="resources" placeholder="VC network, $500k ARR biz, factory" autocomplete="off">
      <p class="hint">What they have access to — comma-separated</p>
    </div>

    <div class="form-group">
      <label for="problems">Problems they mentioned</label>
      <input type="text" id="problems" name="problems" placeholder="can't find good engineers, cash flow issues" autocomplete="off">
      <p class="hint">Pain points — comma-separated</p>
    </div>

    <div class="form-group">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" placeholder="Anything else worth remembering…"></textarea>
    </div>

    <div class="form-group">
      <div class="checkbox-row">
        <input type="checkbox" id="auto_analyze" name="auto_analyze" value="1" checked>
        <label for="auto_analyze">Analyze with Claude after saving</label>
      </div>
    </div>

    <button class="btn btn-primary" type="submit">Save Contact</button>

  </form>
</div>

{% endblock %}
