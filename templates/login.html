{% extends "base.html" %}
{% block title %}Unlock — Directory{% endblock %}
{% block body %}
<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;">
  <div style="width:100%;max-width:340px;">
    <div style="text-align:center;margin-bottom:32px;">
      <div style="font-size:3rem;margin-bottom:8px;">📇</div>
      <h1 style="font-size:1.4rem;font-weight:700;">Personal Directory</h1>
      <p style="color:var(--muted);font-size:0.9rem;margin-top:4px;">Enter your PIN to continue</p>
    </div>

    {% for msg in get_flashed_messages(category_filter=["error"]) %}
      <div class="flash flash-error">{{ msg }}</div>
    {% endfor %}

    <form method="POST">
      <div class="form-group">
        <input type="password" name="pin" placeholder="PIN" inputmode="numeric"
               pattern="[0-9]*" autocomplete="current-password"
               style="text-align:center;font-size:1.4rem;letter-spacing:0.3em;"
               autofocus>
      </div>
      <button class="btn btn-primary" type="submit">Unlock</button>
    </form>
  </div>
</div>
{% endblock %}
